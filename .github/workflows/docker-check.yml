name: Docker image check
on:
  push:
    paths: ['Dockerfile', 'compose.yaml', '.dockerignore', 'monitor/**', '.github/workflows/docker-check.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait
      - name: Check local page and default region
        run: |
          curl --fail http://127.0.0.1:8765/ >/dev/null
          docker compose exec -T stockroom python -c "from app import Engine; e=Engine('/data'); assert len(e.store_data['zh_HK'])==6; assert len(e.store_data['ja_JP'])>0"
      - if: always()
        run: docker compose down
